# Fly.io app for the background worker (SPEC §3). Deploy from the repo root:
#   flyctl deploy --config worker/fly.toml --remote-only --build-arg WORKER_VERSION=<git sha>
# This is staging. Production is `cm-suite-worker-production` (same file, `--app cm-suite-worker-production`).
app = "cm-suite-worker-staging"
primary_region = "sjc"

# SIGTERM → the worker stops polling and finishes the jobs in flight. Anything still running after this is
# redelivered by the queue (handlers are idempotent).
kill_signal = "SIGTERM"
kill_timeout = "300s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # WORKER_VERSION is baked into the image by --build-arg (falls back to FLY_IMAGE_REF at runtime).
  # Secrets (fly secrets set): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
  # R2_SECRET_ACCESS_KEY, R2_BUCKET, SENTRY_DSN.

# No [http_service] / [[services]]: the worker only polls the database, nothing connects to it.
# Keep exactly one machine: `fly scale count 1 --config worker/fly.toml`.

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"

# Multi-GB plan sets need scratch space beyond the root filesystem. To use a volume:
#   fly volumes create worker_tmp --region sjc --size 20 --config worker/fly.toml
# then uncomment below and set WORKER_TMP_DIR = "/data/tmp" in [env].
# [mounts]
#   source = "worker_tmp"
#   destination = "/data"
