name: Deploy app (GitHub Pages)
# Staging hosting, the same way My Daily Reports is hosted (GitHub Pages). The app is a static build that talks to
# the staging Supabase project. Runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /cm-suit/
          VITE_SUPABASE_URL: https://feniqsyiknxgiwowwrnd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rbZ-RosQnNBPZFa6xgP6ww_d7--C9Ty
          VITE_APP_ORIGIN: https://jessesbillz-cloud.github.io/cm-suit
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
