name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: typecheck / lint / knip / hygiene / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm run hygiene
      - run: npm run test:unit
      - name: Deno lint + check (edge functions)
        uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # The functions' own config and Deno's package cache: the repo's package.json + node_modules (from npm ci) would
      # otherwise put Deno in node_modules mode, where the pinned npm: versions of the functions are not found.
      - run: |
          deno lint --config supabase/functions/deno.json supabase/functions
          deno check --config supabase/functions/deno.json --node-modules-dir=none supabase/functions/*/index.ts

  database:
    name: migrations from zero + pgTAP + probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: 2.118.0 }
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Edge functions for the probes
        # Dummy values: the functions refuse to run without their secrets (CLAUDE.md rule 4). Nothing is sent anywhere.
        run: |
          cat > supabase/functions/.env <<'ENV'
          APP_ORIGIN=http://localhost:5173
          CRON_SECRET=ci-cron-secret
          EMAIL_FROM=ci@example.test
          EMAIL_TEST_MODE=true
          RESEND_API_KEY=re_ci_dummy
          RESEND_WEBHOOK_SECRET=whsec_Y2ktZHVtbXktc2VjcmV0LWNpLWR1bW15LXNlY3JldA==
          ANTHROPIC_API_KEY=ci-dummy
          ENV
          supabase functions serve --env-file supabase/functions/.env > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/access || true)
            case "$code" in 400|401|429) echo "functions up ($code)"; exit 0 ;; esac
            sleep 3
          done
          cat "$RUNNER_TEMP/functions.log"; exit 1
      - name: Probes against local stack
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export PROBE_SUPABASE_URL="$API_URL"
          export PROBE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export PROBE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          npm run test:security
      - name: Stale generated types fail the build
        if: ${{ !cancelled() }}
        # The committed types come from the hosted generator (formatted, with an __InternalSupabase block); the CLI's
        # local output is unformatted and from a newer generator (NonNullable<Json>, (T)[], Record<PropertyKey, never>
        # args, never for generated columns). Compare token by token with those mapped, ignoring quotes and layout.
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/local.types.ts"
          tokens() {
            awk '/^  \/\/ (Allows to automatically|instead of createClient)/ { next }
                 /^  __InternalSupabase: \{/ { skip = 1; next }
                 skip { if ($0 ~ /^  \}/) skip = 0; next }
                 { print }' "$1" \
              | sed -e 's/NonNullable<Json>/Json/g' -e 's/Record<PropertyKey, never>/never/g' -e 's/?: unknown/?: never/g' \
              | tr -d "\"'|()" | tr ',;' '  ' | sed 's/[][{}<>]/ & /g' \
              | tr -s ' \t\r\n' '\n' | sed '/^$/d'
          }
          if ! diff -U 8 <(tokens src/data/database.types.ts) <(tokens "$RUNNER_TEMP/local.types.ts") > "$RUNNER_TEMP/types.diff"; then
            # The first lines as an annotation, so the reason shows without opening the log.
            summary=$(grep -E '^[-+][^-+]' "$RUNNER_TEMP/types.diff" | sort | uniq -c | sort -rn | head -40)
            echo "::error title=Stale generated types (differing tokens, count)::$(printf '%s' "$summary" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Stale generated types (first lines)::$(head -c 2500 "$RUNNER_TEMP/types.diff" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            cat "$RUNNER_TEMP/types.diff"
            exit 1
          fi
      - name: Functions log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/functions.log" || true

  e2e:
    name: Playwright (tap budgets)
    runs-on: ubuntu-latest
    needs: [gates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-placeholder
          VITE_E2E_MOCK: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
