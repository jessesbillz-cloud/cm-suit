name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: typecheck / lint / knip / hygiene / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm install --no-audit --no-fund # TODO: switch to npm ci once package-lock.json is committed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm run hygiene
      - run: npm run test:unit
      - name: Deno lint + check (edge functions)
        uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno lint supabase/functions && deno check supabase/functions/**/index.ts

  database:
    name: migrations from zero + pgTAP + probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm install --no-audit --no-fund # TODO: switch to npm ci once package-lock.json is committed
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: supabase db reset
      - name: Stale generated types fail the build
        run: |
          npm run gen:types
          git diff --exit-code src/data/database.types.ts
      - run: supabase test db
      - name: Probes against local stack
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export PROBE_SUPABASE_URL="$API_URL" PROBE_ANON_KEY="$ANON_KEY" PROBE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run test:security

  e2e:
    name: Playwright (tap budgets)
    runs-on: ubuntu-latest
    needs: [gates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm install --no-audit --no-fund # TODO: switch to npm ci once package-lock.json is committed
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-placeholder
          VITE_E2E_MOCK: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
