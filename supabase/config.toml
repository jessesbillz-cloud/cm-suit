# Supabase CLI v2 configuration. Every edge function is listed here (CLAUDE.md rule 4).
# verify_jwt = true is a second layer; requireUser() in _shared/auth.ts is the real gate.
# verify_jwt = false ONLY for the public endpoints of SPEC §6.4.

project_id = "cm-suite"

[api]
enabled = true
port = 54321
# Only public is exposed. Never add pgmq, pgmq_public or queue here (SPEC §6.1).
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[storage]
enabled = true
# Multi-GB plan sets (SPEC §6.5). Uploads use TUS resumable uploads.
file_size_limit = "5GiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Outside recipients sign in by email code without an existing account.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 900

# Custom SMTP (Resend) delivers the Auth email codes. Configured per environment (dashboard / CI env), not locally:
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "env(EMAIL_FROM)"
# sender_name = "env(BRAND_NAME)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# --- Public endpoints (SPEC §6.4): no platform JWT check; each function gates itself. ---
[functions.access]
verify_jwt = false

[functions.share]
verify_jwt = false

[functions.email-events]
verify_jwt = false

[functions.inbound-email]
verify_jwt = false

# --- Signed-in users ---
[functions.download]
verify_jwt = true

[functions.invite-member]
verify_jwt = true

[functions.revoke-member]
verify_jwt = true

[functions.send-transmittal]
verify_jwt = true

[functions.invite-bidders]
verify_jwt = true

[functions.issue-addendum]
verify_jwt = true

[functions.extract-bid]
verify_jwt = true

[functions.import-subs]
verify_jwt = true

[functions.ir-pdf]
verify_jwt = true

[functions.ir-send]
verify_jwt = true

[functions.rfis]
verify_jwt = true

# --- Cron (x-cron-secret; the caller also sends a platform key as Bearer to pass verify_jwt) ---
[functions.queue-health]
verify_jwt = true

# --- Public endpoint (SPEC §6.4 #7) ---
# calendar-feed: calendar apps subscribe to a URL and fetch it with no session or headers of ours, so the platform JWT
# check can't apply. The per-person secret token (?t=, only its sha256 stored, rotatable) is the gate; zod, a rate
# limit per IP and per token, and a bare 404 for anything unknown.
[functions.calendar-feed]
verify_jwt = false

# --- Dailies ---
[functions.submit-daily]
verify_jwt = true

[functions.email-daily]
verify_jwt = true

# --- Public endpoint (SPEC §6.4 #3): the delivery link. verify_jwt = false because people on the job site (drivers,
# suppliers, subs' crews) post and watch the board without an account. The function gates itself: token hash, rate
# limits per IP and per token, zod on every input, board fields only. ---
[functions.delivery-board]
verify_jwt = false

# --- Testing-only public endpoint (Jesse, Sep 28; docs/decisions.md): personal sign-in links. The person has no session
# yet, so the platform JWT check can't apply; the key (only its SHA-256 stored, allowlisted addresses only, revocable)
# is the gate, with zod, rate limits per IP and per key, and a bare 404 for anything unknown. Remove before real use. ---
[functions.key-login]
verify_jwt = false


# --- Hours: my monthly timesheet (signed) and invoice PDFs ---
[functions.timesheets]
verify_jwt = true

# --- Public endpoint (SPEC §6.4 #4): the job's inspection request link and the inspector's hub. verify_jwt = false
# because subs open the link or scan the QR sheet before they have an account. The function gates itself: token hash
# (job or hub), rate limits per IP and per token, zod on every input, the job name / hub job names only; joining needs
# the visitor's own session (the email code), checked with requireUser. ---
[functions.request-link]
verify_jwt = false

# --- Permits: the official stamps the plans and issues the permit (signed; one PDF per request) ---
[functions.permit-stamp]
verify_jwt = true

# --- Revs: the OSFM inspection map (render, download / view, and the sheet for the in-app viewer) ---
[functions.ir-map]
verify_jwt = true

# --- Public endpoint (SPEC §6.4 #8): the meeting sign-in page (tailgate safety meetings and job meetings, 0060).
# verify_jwt = false because the crew scans the QR with no account. The function gates itself: the meeting's token
# hash (made by the leader, dropped on close, 18 hours at most), rate limits per IP and per meeting, zod on every input,
# the page's facts only and never a name back. ---
[functions.meeting-signin]
verify_jwt = false

# --- Safety: close a meeting and make its sign-in sheet PDF; a library topic's PDF ---
[functions.safety-meeting]
verify_jwt = true
